<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Foundations FB Event Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0D0D0D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* 1920x1005 Facebook event cover */
        .banner {
            width: 1920px;
            height: 1005px;
            background: #1A1A1A;
            padding: 80px 100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* Grid lines overlay */
        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(#2A2A2A 1px, transparent 1px),
                linear-gradient(90deg, #2A2A2A 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
            pointer-events: none;
        }

        .left-section {
            position: relative;
            z-index: 1;
            max-width: 1100px;
        }

        .venue {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: #FF6600;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 32px;
        }

        .title {
            font-family: 'Inter', sans-serif;
            font-size: 140px;
            font-weight: 700;
            color: #00FFFF;
            line-height: 0.95;
            margin-bottom: 24px;
            text-shadow: 0 0 60px rgba(0, 255, 255, 0.3);
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 36px;
            color: #E8E8E8;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        .description {
            font-family: 'Inter', sans-serif;
            font-size: 28px;
            color: #A0A0A0;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .instructor {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            color: #FF6600;
        }

        .right-section {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .topics {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topic {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            color: #E8E8E8;
            background: #2A2A2A;
            padding: 14px 28px;
            border-radius: 4px;
            border-left: 3px solid #00FFFF;
            white-space: nowrap;
        }

        /* Decorative accent lines */
        .accent-line {
            position: absolute;
            top: 60px;
            right: 80px;
            width: 120px;
            height: 4px;
            background: #00FFFF;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .accent-line-2 {
            position: absolute;
            top: 72px;
            right: 80px;
            width: 70px;
            height: 4px;
            background: #FF6600;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="accent-line"></div>
        <div class="accent-line-2"></div>
        <div class="left-section">
            <h1 class="title">DJ Foundations</h1>
            <p class="subtitle">Song Prep in Rekordbox<br>Mixing on Pioneer Gear</p>
            <p class="description">
                Learn to prep tracks in Rekordbox, load a USB,<br>
                and start practicing at open decks.
            </p>
            <p class="instructor">taught by HeDawn</p>
        </div>

        <div class="right-section">
            <div class="topics">
                <span class="topic">Song Prep</span>
                <span class="topic">Beatmatching</span>
                <span class="topic">Phrasing</span>
                <span class="topic">Basic Mixing</span>
            </div>
        </div>

        </div>
</body>
</html>
